{% extends 'base.html' %}

{% block title %}Request Access - TB-PTLD System{% endblock %}

{% block content %}
<div style="display: flex; align-items: center; justify-content: center; min-height: calc(100vh - 200px);">
    <div style="width: 100%; max-width: 480px;">
        <div class="card" style="padding: 40px;">
            <div style="text-align: center; margin-bottom: 32px;">
                <div style="width: 48px; height: 48px; background: var(--accent-soft); color: var(--accent-primary); border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; font-size: 24px; margin-bottom: 16px;">
                    <i class="bi bi-person-plus-fill"></i>
                </div>
                <h1 style="font-size: 22px; margin-bottom: 4px;">Request Access</h1>
                <p style="font-size: 14px; color: var(--text-tertiary);">Create your clinical or research account</p>
            </div>
            
            <form method="post">
                {% csrf_token %}
                
                <div class="form-group">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" id="username" placeholder="e.g. dr_smith" required>
                </div>

                <div class="form-group">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" name="email" class="form-control" id="email" placeholder="name@hospital.org" required>
                </div>

                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" name="password" class="form-control" id="password" placeholder="••••••••" required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="confirm_password" class="form-label">Confirm</label>
                            <input type="password" name="confirm_password" class="form-control" id="confirm_password" placeholder="••••••••" required>
                        </div>
                    </div>
                </div>

                <div class="form-group" style="margin-bottom: 32px;">
                    <label for="role" class="form-label">Account Type</label>
                    <select name="role" id="role" class="form-control" required>
                        <option value="CLINICIAN">Clinician (Patient Management)</option>
                        <option value="ANALYST">Data Analyst (Research & Stats)</option>
                    </select>
                    <div style="font-size: 11px; color: var(--text-tertiary); margin-top: 8px;">
                        <i class="bi bi-info-circle"></i> New accounts require administrator activation.
                    </div>
                </div>
                
                <button type="submit" class="btn-primary" style="width: 100%; justify-content: center; padding: 14px;">
                    Submit Request
                </button>
            </form>

            <div style="text-align: center; margin-top: 32px; padding-top: 24px; border-top: 1px solid var(--border-light);">
                <p style="font-size: 13px; margin-bottom: 0;">
                    Already have an account? 
                    <a href="{% url 'login' %}" style="color: var(--accent-primary); font-weight: 600;">Sign in here</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
